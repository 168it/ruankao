<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">软考小课堂 - 计算机软考免费学习资料库</title>
  <desc id="desc">覆盖高级、中级、初级共20个科目的软考备考资料，包括知识点视频、三色笔记、章节练习题，完全免费</desc>

  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="green-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purple-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-gradient)"/>

  <!-- Decorative shapes -->
  <circle cx="1100" cy="100" r="150" fill="rgba(14,165,233,0.1)"/>
  <circle cx="100" cy="350" r="100" fill="rgba(139,92,246,0.08)"/>
  <circle cx="600" cy="50" r="60" fill="rgba(16,185,129,0.06)"/>

  <!-- Left side: Title and description -->
  <g id="title-block" transform="translate(60 50)">
    <!-- Category label -->
    <rect x="0" y="0" width="200" height="36" rx="18" fill="url(#accent-gradient)"/>
    <text x="100" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="14" font-weight="600" fill="white" text-anchor="middle">计算机软考备考资料</text>

    <!-- Main title -->
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="64" font-weight="800" fill="#0f172a" letter-spacing="-1">软考小课堂</text>

    <!-- Subtitle -->
    <text x="0" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="22" fill="#64748b" font-weight="400">免费开源 · 20个科目全覆盖 · 高效备考</text>

    <!-- Stats cards -->
    <g transform="translate(0 170)">
      <!-- Card 1: Subjects -->
      <rect x="0" y="0" width="120" height="70" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1"/>
      <text x="60" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="36" font-weight="700" fill="#0ea5e9" text-anchor="middle">20</text>
      <text x="60" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="13" fill="#64748b" text-anchor="middle">科目方向</text>

      <!-- Card 2: Levels -->
      <rect x="140" y="0" width="120" height="70" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1"/>
      <text x="200" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="36" font-weight="700" fill="#f59e0b" text-anchor="middle">3</text>
      <text x="200" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="13" fill="#64748b" text-anchor="middle">级别分类</text>

      <!-- Card 3: Free -->
      <rect x="280" y="0" width="120" height="70" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1"/>
      <text x="340" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="28" font-weight="700" fill="#10b981" text-anchor="middle">100%</text>
      <text x="340" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="13" fill="#64748b" text-anchor="middle">免费开源</text>
    </g>
  </g>

  <!-- Right side: Subject cards -->
  <g id="subject-cards" transform="translate(680 45)">
    <!-- 高级 -->
    <g transform="translate(0 0)">
      <rect x="0" y="0" width="460" height="105" rx="14" fill="white" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="0" y="0" width="5" height="105" rx="2.5" fill="url(#gold-gradient)"/>
      <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="18" font-weight="700" fill="#f59e0b">高级资格</text>
      <text x="24" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="13" fill="#475569">系统架构设计师 · 系统分析师 · 信息系统项目管理师</text>
      <text x="24" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="13" fill="#475569">系统规划与管理师 · 网络规划设计师</text>
      <text x="420" y="55" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="32" font-weight="700" fill="#fbbf24" opacity="0.3">5</text>
    </g>

    <!-- 中级 -->
    <g transform="translate(0 120)">
      <rect x="0" y="0" width="460" height="145" rx="14" fill="white" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="0" y="0" width="5" height="145" rx="2.5" fill="url(#green-gradient)"/>
      <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="18" font-weight="700" fill="#10b981">中级资格</text>
      <text x="24" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="13" fill="#475569">软件设计师 · 网络工程师 · 系统集成项目管理工程师</text>
      <text x="24" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="13" fill="#475569">数据库系统工程师 · 信息安全工程师 · 信息系统管理工程师</text>
      <text x="24" y="101" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="13" fill="#475569">信息系统监理师 · 软件评测师 · 嵌入式系统设计师</text>
      <text x="24" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="13" fill="#475569">电子商务设计师 · 多媒体应用设计师</text>
      <text x="420" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="32" font-weight="700" fill="#34d399" opacity="0.3">11</text>
    </g>

    <!-- 初级 -->
    <g transform="translate(0 280)">
      <rect x="0" y="0" width="460" height="95" rx="14" fill="white" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="0" y="0" width="5" height="95" rx="2.5" fill="url(#purple-gradient)"/>
      <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="18" font-weight="700" fill="#8b5cf6">初级资格</text>
      <text x="24" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
            font-size="13" fill="#475569">程序员 · 网络管理员 · 信息处理技术员 · 信息系统运行管理员</text>
      <text x="420" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="32" font-weight="700" fill="#a78bfa" opacity="0.3">4</text>
    </g>
  </g>

  <!-- Bottom accent line -->
  <rect x="60" y="370" width="240" height="3" rx="1.5" fill="url(#accent-gradient)"/>
</svg>
